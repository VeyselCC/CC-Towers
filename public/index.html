<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070b1f">
  <meta name="description" content="Space Towers – Tri-Peaks-Solitaire im Weltraum. Allein oder mit Freunden im Browser.">
  <title>Space Towers</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <!-- ===================== Startbildschirm ===================== -->
  <section id="screen-home" class="screen active">
    <div class="home-card panel">
      <h1 class="logo"><span>SPACE</span><span>TOWERS</span></h1>
      <p class="tagline">Räume die drei Türme ab – Karte für Karte, eins höher oder eins tiefer.</p>

      <label class="field">
        <span>Dein Name</span>
        <input id="name-input" maxlength="16" autocomplete="nickname" placeholder="Pilot">
      </label>

      <button id="btn-solo" class="btn primary big">Solo spielen</button>

      <div class="divider"><span>Mit Freunden</span></div>

      <button id="btn-create" class="btn accent big">Raum erstellen</button>
      <div class="join-row">
        <input id="code-input" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Raumcode">
        <button id="btn-join" class="btn">Beitreten</button>
      </div>
      <p id="home-error" class="error" role="alert"></p>

      <button id="btn-rules" class="btn link">Spielregeln</button>
    </div>
  </section>

  <!-- ===================== Lobby ===================== -->
  <section id="screen-lobby" class="screen">
    <div class="lobby panel">
      <div class="lobby-head">
        <div>
          <div class="muted small">Raumcode</div>
          <div id="lobby-code" class="room-code">----</div>
        </div>
        <button id="btn-copy" class="btn">Einladungslink kopieren</button>
      </div>
      <p id="copy-hint" class="muted small invite-link"></p>

      <h3>Spieler <span id="lobby-count" class="muted"></span></h3>
      <ul id="lobby-players" class="player-list"></ul>

      <h3>Einstellungen</h3>
      <div class="settings">
        <label>Runden
          <select id="set-rounds">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="5">5</option><option value="7">7</option><option value="10" selected>10</option>
          </select>
        </label>
        <label>Zeit pro Runde
          <select id="set-time">
            <option value="60">1 Minute</option><option value="120">2 Minuten</option>
            <option value="180">3 Minuten</option><option value="300">5 Minuten</option>
            <option value="600">10 Minuten</option><option value="0">Unbegrenzt</option>
          </select>
        </label>
        <label class="check">
          <input id="set-wrap" type="checkbox"> König ↔ Ass verbinden
        </label>
      </div>
      <p id="lobby-hint" class="muted small"></p>

      <div class="row">
        <button id="btn-leave" class="btn">Verlassen</button>
        <button id="btn-start" class="btn primary big">Spiel starten</button>
      </div>
    </div>
  </section>

  <!-- ===================== Spiel ===================== -->
  <section id="screen-game" class="screen">
    <header class="hud">
      <button id="btn-menu" class="icon-btn" title="Menü" aria-label="Menü">☰</button>
      <div class="hud-stat"><span class="label">Punkte</span><span id="hud-score" class="value">0</span></div>
      <div class="hud-stat"><span class="label">Kette</span><span id="hud-streak" class="value">0</span></div>
      <div class="hud-stat"><span class="label">Karten</span><span id="hud-left" class="value">28</span></div>
      <div class="hud-stat" id="hud-round-wrap"><span class="label">Runde</span><span id="hud-round" class="value">1/3</span></div>
      <div class="hud-stat" id="hud-time-wrap"><span class="label">Zeit</span><span id="hud-time" class="value">3:00</span></div>
      <div class="hud-spacer"></div>
      <button id="btn-sound" class="icon-btn" title="Ton an/aus (M)" aria-label="Ton an/aus">🔊</button>
    </header>

    <div class="game-main">
      <aside id="opponents" class="opponents"></aside>
      <div id="table" class="table">
        <div id="board" class="board"></div>
        <div id="fx" class="fx"></div>
      </div>
    </div>

    <footer class="controls">
      <button id="btn-giveup" class="btn">Aufgeben</button>
      <div id="emotes" class="emotes">
        <button data-e="👍">👍</button><button data-e="🔥">🔥</button><button data-e="😂">😂</button>
        <button data-e="😮">😮</button><button data-e="🚀">🚀</button><button data-e="😭">😭</button>
      </div>
      <button id="btn-new" class="btn">Neues Spiel</button>
    </footer>
  </section>

  <!-- ===================== Overlays ===================== -->
  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div id="overlay-box" class="panel overlay-box"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="conn" class="conn hidden">Verbindung wird wiederhergestellt …</div>

  <template id="rules-tpl">
    <h2>Spielregeln</h2>
    <ul class="rules">
      <li>Drei Türme aus <b>28 Karten</b> liegen vor dir. Spielbar sind nur <b>offene</b> Karten, also Karten, die von keiner anderen verdeckt werden.</li>
      <li>Tippe eine offene Karte an, deren Wert <b>genau eins höher oder tiefer</b> ist als die oberste Karte der Ablage. Die Farbe ist egal. <br><span class="muted">Beispiel: Auf eine 7 passt eine 6 oder eine 8.</span></li>
      <li>Mit <b>König ↔ Ass</b> darf auf einen König ein Ass folgen und umgekehrt.</li>
      <li>Geht nichts mehr, tippe auf den <b>Nachziehstapel</b>. Die neue Karte liegt dann oben auf der Ablage.</li>
      <li><b>Bonus-Stapel:</b> Legst du 3 Karten in Folge ab, erscheint rechts ein Bonus-Stapel mit 3 Zusatzkarten. Sie passen der Reihe nach auf die Ablage und verlängern deine Kette. Ziehst du eine neue Karte, verschwindet der Bonus-Stapel.</li>
      <li>Du gewinnst, wenn alle drei Türme abgeräumt sind. Wenn der Stapel leer ist und keine Karte mehr passt, ist das Spiel vorbei.</li>
    </ul>
    <h3>Punkte</h3>
    <ul class="rules">
      <li>Jede Karte in einer <b>Kette</b> bringt mehr: 10, 20, 30 … Punkte. Nachziehen beendet die Kette.</li>
      <li>Turmspitze abgeräumt: <b>+250</b>, alle drei Türme: <b>+1000</b>.</li>
      <li>Karten vom Bonus-Stapel zählen wie normale Kettenkarten.</li>
      <li>Jede übrige Stapelkarte beim Sieg: <b>+50</b>.</li>
    </ul>
    <h3>Mit Freunden</h3>
    <ul class="rules">
      <li>Erstelle einen Raum und schick den Code oder Link an deine Freunde.</li>
      <li>Ein Turnier hat standardmäßig <b>10 Runden</b>. In jeder Runde bekommen alle <b>dasselbe Kartenblatt</b>.</li>
      <li><b>💀 Totenkopf:</b> Ab 3 Spielern scheidet in bestimmten Runden der Spieler mit den wenigsten Gesamtpunkten aus. Der Totenkopf steht dann neben der Rundenanzeige. Am Ende spielen die besten zwei um den Sieg.</li>
      <li>Es gewinnt, wer bis zum Schluss dabei ist und die meisten Gesamtpunkte hat.</li>
    </ul>
    <h3>Tastatur</h3>
    <p class="muted small">Leertaste = Nachziehen · B = Bonuskarte · M = Ton · Esc = Menü</p>
  </template>

  <script src="game.js"></script>
  <script src="room-transport.js"></script>
  <script src="app.js"></script>
</body>
</html>
